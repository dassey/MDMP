name: tests

# Runs the suite on every push and every pull request. The application is
# stdlib-only, so most of this is just "install a Python and go".

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises; the newest is the one people
        # will actually have. Both are tested so neither can drift unnoticed.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: unit, integration, and smoke
        run: python3 scripts/run_tests.py --no-browser

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The only dependency anywhere in the project, and only for this stage.
      - name: install playwright
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: browser tests
        run: python3 scripts/ui_test.py --shots screenshots

      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
